name: Pruebas de la API

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/solicitudes_academicas_test
          JWT_SECRET: clave_solo_para_ci
